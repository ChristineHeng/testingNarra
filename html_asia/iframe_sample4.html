  <style>
    body {
      padding: 0;
      margin: 0;
      overflow-x: hidden;
    }

    body,
    html {
      -webkit-user-select: none;
      user-select: none;
      width: 100%;
      height: 100%;
    }

    .cr_wrp_iwrp::after {
      background: linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, #000 100%);
    }

    .cr_wrp_iwrp iframe {
      border: 6px solid rgba(255, 255, 255, 0.13);
    }

    .cr_wrp_html::after {
      background: linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, #000 100%);
    }

    .cr_wrp_html .n_container {
      border: 6px solid rgba(255, 255, 255, 0.13);
    }

    .cr_wrp_iwrp {
      display: block;
      width: 90vw;
      height: 60vh;
      margin: 0 auto;
      position: relative;
    }

    .cr_wrp_iwrp::after {
      content: "";
      width: 100vw;
      height: 30vh;
      bottom: 0;
      left: 0;
      position: absolute;
    }

    .cr_wrp_iwrp iframe {
      border-radius: 24px;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .cr_wrp_html {
      height: 60vh;
      position: relative;
    }

    .cr_wrp_html .n_container {
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      width: 90vw;
      height: 60vh;
      margin: 0 auto;
      z-index: -1;
    }

    .cr_wrp_html .footer_main {
      position: absolute;
      z-index: -1;
      width: calc(90vw - 12px);
      left: calc(5vw + 6px);
      bottom: 0 !important;
    }

    .cr_wrp_html .n_footer_combo {
      position: absolute;
      z-index: -1;
      padding-bottom: 50px;
    }

    .cr_wrp_html .n_footer {
      position: absolute;
      bottom: 0;
    }

    .cr_wrp_html::after {
      content: "";
      width: 100vw;
      height: 30vh;
      bottom: 0;
      left: 0;
      position: absolute;
    }
  </style>
</head>
