<script>
	$(document).ready(function () {
		$('#selectleague_footer')
			.find('.placebet_nav_button')
			.on('click', function () {
				$('#selectleague_footer').hide();
				$('#selectleague').hide();
				popupOff();
			});
		$('#select_league_close').on('click', function () {
			$('#selectleague_footer, #selectleague').hide();
			popupOff();
		});
		const updateHeader = ($hdr) => {
			if (!$hdr || !$hdr.length) return;

			const $section = $hdr.nextUntil('.header_main_alt');
			const $contents = $section.filter('.listItem:not(.header)');
			const anyVisible = $contents.filter(':visible').length > 0;
			const $icon = $hdr.find('.leagueToggle i');

			$icon.toggleClass('fl_rotate', !anyVisible);
		};
		const updateHeaderPredict = ($hdr, $toggledItems) => {
			if (!$hdr || !$hdr.length) return;

			const $section = $hdr.nextUntil('.header_main_alt');
			const $allContents = $section.filter('.listItem:not(.header)');
			const toggledAnyVisibleNow = $toggledItems.filter(':visible').length > 0;

			let anyVisibleAfter = false;

			$allContents.each(function () {
				const $el = $(this);
				const isInToggled = $toggledItems.is(this);
				const visibleNow = $el.is(':visible');
				const visibleAfter = isInToggled ? !toggledAnyVisibleNow : visibleNow;

				if (visibleAfter) {
					anyVisibleAfter = true;
					return false;
				}
			});

			$hdr.find('.leagueToggle i').toggleClass('fl_rotate', !anyVisibleAfter);
		};
		$('.header_main_alt').on('click', function () {
			const $hdr = $(this);

			// console.log($hdr)
			const $section = $hdr.nextUntil('.header_main_alt');
			const $contents = $section.filter('.listItem:not(.header)');
			const $subHeader = $hdr.nextUntil('.header_main_alt', '.listItem.header');

			const anyVisible = $contents.filter(':visible').length > 0;
			if (anyVisible) {
				$contents.stop(true, true).slideUp(200);
				$subHeader.find('.leagueCount i').addClass('fl_rotate');
			} else {
				$contents.stop(true, true).slideDown(200);
				$subHeader.find('.leagueCount i').removeClass('fl_rotate');
			}

			$hdr.find('.leagueToggle i').toggleClass('fl_rotate', anyVisible);
		});

		$('.listItem.header input, .listItem.header .leagueCount').on('click', function () {
			const $subHdr = $(this).closest('.listItem.header');
			const $hdr = $subHdr.prevAll('.header_main_alt').first();
			const $items = $subHdr.nextUntil('.header, .header_main_alt', '.listItem');
			$subHdr.find('i').toggleClass('fl_rotate');
			updateHeaderPredict($hdr, $items);
			$items.stop(true, true).slideToggle(200);
		});

		if (localStorage.getItem('isFacelift') === 'true') {
			if (sessionStorage.getItem('enterCyberBattle') === 'true') {
				$('.title').children('#mock_fl_s_title_img_cb').show();
				$('#mock_fl_s_title_img_cb').siblings('i').hide();
				$('.title').children('#mock_fl_s_title_img_fl').hide();
			} else {
				$('.title').children('#mock_fl_s_title_img_fl').show();
				$('#mock_fl_s_title_img_fl').siblings('i').hide();
				$('.title').children('#mock_fl_s_title_img_cb').hide();
			}
		}

		const triggerIOSHaptic = () => {
			const input = document.createElement('input');
			input.type = 'checkbox';
			input.setAttribute('switch', '');
			input.style.display = 'none';
			document.body.appendChild(input);
			input.click();
			document.body.removeChild(input);
		};

		const hapticFeedback = () => {
			if (navigator.vibrate) {
				navigator.vibrate(10); // Android
			} else {
				triggerIOSHaptic(); // iOS fallback
			}
		};

		$(function () {
			const $scroll = $('.alph_scroll');
			const $items = $scroll.find('.item');
			const $tooltip = $('.alph_scroll_t.tooltip');
			let lastActiveKey = null;
			function detectLetter(x) {
				$items.each(function () {
					const $item = $(this);
					const top = $item.offset().top;
					const bottom = top + $item.outerHeight();

					if (x >= top && x <= bottom) {
						const key = $item.find('i').length ? 'icon' : $.trim($item.text());
						if (key !== lastActiveKey) {
							hapticFeedback();
							lastActiveKey = key;
						}
						$items.removeClass('active');
						$item.addClass('active');
						const content = $item.find('i').length ? $item.find('i').clone() : key;
						$tooltip.html(content).css({
							top: $item.offset().top - 40,
							display: 'flex',
						});
						handleAlphabetSelection(key);
						return false;
					}
				});
			}

			let hideTimer = null;
			$scroll.on('touchstart touchmove', function (e) {
				// e.preventDefault();
				detectLetter(e.originalEvent.touches[0].clientY);
			});
			$scroll.on('touchend', function () {
				clearTimeout(hideTimer);
				hideTimer = setTimeout(function () {
					$tooltip.hide();
					lastActiveKey = null;
				}, 500);
			});
			let dragging = false;
			$scroll.on('mousedown', function (e) {
				dragging = true;
				detectLetter(e.clientY);
			});
			$(document).on('mousemove', function (e) {
				if (dragging) detectLetter(e.clientY);
			});
			$(document).on('mouseup', function () {
				dragging = false;
				clearTimeout(hideTimer);
				hideTimer = setTimeout(function () {
					$tooltip.hide();
					lastActiveKey = null;
				}, 500);
			});

			function scrollToItem($target) {
				const $container = $('#selectleague');
				if (!$target.length) return;
				$container.stop(true, false);
				$container.animate(
					{
						scrollTop: $target.position().top + $container.scrollTop() - 40,
					},
					300,
				);
			}

			function handleAlphabetSelection(key) {
				if (key === 'icon') {
					const $leaguesHeader = $('.listItem.header_main').first();
					scrollToItem($leaguesHeader);
					return;
				}
				const $moreLeagues = $('.listItem.header_main').filter(function () {
					return $(this).text().trim() === 'More Leagues';
				});

				const $target = $moreLeagues
					.nextAll('.listItem.header')
					.filter(function () {
						const name = $(this).find('label.container').text().trim();
						return name.charAt(0).toUpperCase() === key;
					})
					.first();
				scrollToItem($target);
			}
		});
	});

	$(function () {
		var targetSelector = '.league_name';

		$(targetSelector).each(function () {
			var $el = $(this);

			if (!$el.data('original')) {
				$el.data('original', $.trim($el.text()));
			}
		});

		function escapeRegExp(str) {
			return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
		}

		function highlight(text, keyword) {
			if (!keyword) return text;

			var safeKeyword = escapeRegExp(keyword);
			var regex = new RegExp('(' + safeKeyword + ')', 'gi');

			return text.replace(regex, '<span class="found">$1</span>');
		}

		$(document).on('input', '.league-search', function () {
			var keyword = $.trim($(this).val()).toLowerCase();

			$(targetSelector).each(function () {
				var $el = $(this);
				var original = $el.data('original');

				// reset
				$el.html(original);

				if (!keyword) return;

				if (original.toLowerCase().indexOf(keyword) > -1) {
					$el.html(highlight(original, keyword));
				}
			});
		});
	});
</script>
