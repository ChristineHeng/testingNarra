		<script>
			$(document).ready(function () {
				var ifPopupOpen = false;
				$('#demoOnly_devdontcopy_results').load('../html_public/_result-completed.html', function () {
					// Completed Result : popup goal timeline ============================*/
					CompletedRessule_opentimeline();
					var headerHeight = $('.n_header').outerHeight();
					var resultSearchHeight = $('.result_search.n_sticky').outerHeight();
					var filterGroupHeight = $('.filter_group.n_sticky').outerHeight();

					$('.result_search.n_sticky').css('top', headerHeight);
					$('.filter_group.n_sticky').css('top', headerHeight + resultSearchHeight);
					$('.n_grp_header.n_sticky').css('top', headerHeight + resultSearchHeight + filterGroupHeight);

					//detect dropdownbox
					$('#slct3').focus(function () {
						ifPopupOpen = true;
					});

					$(window).on('touchmove', function (e) {
						if (ifPopupOpen) {
							touchHandler();
						}
					});
				});
				function touchHandler(event) {
					ifPopupOpen = false;
					$('#slct3').blur();
				}
				$('#mybet').load('_popup_mybet_unsettled.html');
				$('#mybet').hide();

				$('.n_grp_header').click(function () {
					$(this).parent().find('.completedresult_wrap').toggle();
				});
				//DES-40 Recommended correct score: start
				$('.popup_box_bottom .btn_ok').click(function () {
					$('.countdown_icn circle').removeClass('animated');
					$('.countdown_icn').hide();
					$('.popup_top_wrp')
						.removeClass('slideOut')
						.addClass('slideIn')
						.delay(300)
						.queue(function (next) {
							$('#sample_dont_copy_popup_rmd_bet').hide();
							$('.popup_top_wrp').removeClass('slideIn');
							next();
						});
				});
				//DES-40 Recommended correct score: end

				$('#demoOnly_global_pop_item').load('_global_pop_item.html', function () {});
				if (localStorage.getItem('isFacelift') === 'true') {
					$('#result_completed_filter .filter_item').click(function (e) {
						e.stopPropagation();
						var $this = $(this);
						// Close other open popups
						$('#result_completed_filter .filter_item').not($this).find('.ob_st_popup').hide();
						$('#result_completed_filter .filter_item').not($this).find('.betslip_arrow').removeClass('fl_rotate');
						$this.find('.ob_st_popup').toggle();
						$this.find('.betslip_arrow').toggleClass('fl_rotate');

						if ($this.hasClass('fullW_filter') && $this.find('.ob_st_popup').is(':visible')) {
							var $popup = $this.find('.ob_st_popup');
							$popup.find('input[type="checkbox"]').prop('checked', true);
							$this.find('.betslip_bottom_button.confirm').removeClass('disabled');
						}
					});
					// Close popup when clicking outside
					$(document).click(function () {
						$('#result_completed_filter .filter_item').find('.ob_st_popup').hide();
						$('#result_completed_filter .filter_item').find('.betslip_arrow').removeClass('fl_rotate');
					});

					// Prevent clicks inside ob_st_popup from closing it
					$('#result_completed_filter .ob_st_popup').click(function (e) {
						e.stopPropagation();
					});

					// Filter button - update selectbox_titlerow with checked items
					$('#result_completed_filter .betslip_detail_bottom .confirm').click(function (e) {
						e.stopPropagation();
						if ($(this).hasClass('disabled')) {
							return;
						}
						var $popup = $(this).closest('.ob_st_popup');
						var $filterItem = $(this).closest('.filter_item');
						var $titleRow = $filterItem.find('.selectbox_titlerow');
						var defaultText = $titleRow.data('default-text') || 'All Leagues';
						var $allCheckbox = $popup.find('.ob_st_rw:first input[type="checkbox"]');
						if ($allCheckbox.is(':checked')) {
							$titleRow.text(defaultText);
						} else {
							var checked = [];
							$popup.find('.ob_st_rw:not(:first) input[type="checkbox"]:checked').each(function () {
								checked.push($(this).closest('label').text().trim());
							});
							$titleRow.text(checked.length > 0 ? checked.join(', ') : defaultText);
						}
						$popup.hide();
						$filterItem.find('.betslip_arrow').removeClass('fl_rotate');
					});

					// Clear All button - uncheck all checkboxes, keep popup open
					$('#result_completed_filter .betslip_detail_bottom .normal_btn').click(function (e) {
						e.stopPropagation();
						var $popup = $(this).closest('.ob_st_popup');
						$popup.find('input[type="checkbox"]').prop('checked', false);
						$(this).closest('.betslip_detail_bottom').find('.betslip_bottom_button.confirm').addClass('disabled');
					});

					// "All" checkbox UX: clicking "All" checks all others; clicking others unchecks "All"
					$('#result_completed_filter .ob_st_popup').on('change', 'input[type="checkbox"]', function () {
						var $popup = $(this).closest('.ob_st_popup');
						var $allCheckbox = $popup.find('.ob_st_rw:first input[type="checkbox"]');
						var $otherCheckboxes = $popup.find('.ob_st_rw:not(:first) input[type="checkbox"]');
						var isAllCheckbox = $(this).is($allCheckbox);

						if (isAllCheckbox) {
							// Toggling "All Leagues" toggles every league checkbox to match
							$otherCheckboxes.prop('checked', $allCheckbox.is(':checked'));
						} else {
							// Any interaction with a specific league unchecks "All Leagues"
							$allCheckbox.prop('checked', false);
						}

						var $confirmBtn = $popup.closest('.filter_item').find('.betslip_bottom_button.confirm');
						var anyChecked = $popup.find('input[type="checkbox"]:checked').length > 0;
						$confirmBtn.toggleClass('disabled', !anyChecked);

						$popup.find('.ob_st_rw').removeClass('active');
					});

					// Clear icon - clear the input value
					$('.result_search .clear_icon').click(function () {
						$(this).siblings('input').val('');
					});
				} else {
					$('#result_completed_filter .filter_item').find('.select').show();
				}

				if (sessionStorage.getItem('enterCyberBattle') === 'true') {
					document.querySelector('.demo_mock_result_outright')?.remove();
				}

				$('.mock_result_live_trigger').click(function () {
					checkCyberbattlePage('result-live.html');
				});
				$('.mock_result_completed_trigger').click(function () {
					checkCyberbattlePage('result-completed.html');
				});
				cyberbattleBackButton();

				$('.demoOnlyDropdownDisabled').click(function () {
					$(this).parent().parent().parent().addClass('disabled');
				});

				// Scoped sort button handler for result search
				$('.result_search .ob_sort_wrp').click(function () {
					$(this).toggleClass('active');
					$(this).find('.ob_st_popup').toggle();
				});

				// Close sort popup when clicking outside of it
				$(document).click(function (e) {
					if (!$(e.target).closest('.ob_sort_wrp').length) {
						$('.ob_sort_wrp').removeClass('active').find('.ob_st_popup').hide();
					}
				});

				$('.ob_st_content .ob_st_rw')
					.not(':has(.checkbox)')
					.click(function () {
						$(this).parent().children().removeClass('active');
						$(this).addClass('active');

						var sortText = $(this).text().trim();
						var $popup = $(this).closest('.ob_st_popup');
						var $sortWrp = $popup.parent('.ob_sort_wrp');
						var $icon = $sortWrp.find('.ob_sort').find('i').last();

						var sortIconMap = {
							'By Alphabetical Order': 'icon-fi-sort-alphabetical',
							'By popularity': 'icon-fi-sort-popularity',
							'By time': 'icon-fi-sort-time',
						};

						$icon.removeClass(Object.values(sortIconMap).join(' '));
						if (sortIconMap[sortText]) {
							$icon.addClass(sortIconMap[sortText]);
						}

						$popup.hide();
						$sortWrp.removeClass('active');
					});

				/*completed result: competition dropdown (start)*/
				$('.ob_st_rw')
					.has('.checkbox')
					.click(function () {
						$(this).removeClass('active');
					});
				/*completed result: competition dropdown (end)*/
			});

			// DES-1715 add highlight for search keyword in league name
			$(function () {
				var targetSelector = '.league_name';

				$(targetSelector).each(function () {
					var $el = $(this);

					if (!$el.data('original')) {
						$el.data('original', $.trim($el.text()));
					}
				});

				function escapeRegExp(str) {
					return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
				}

				function highlight(text, keyword) {
					if (!keyword) return text;

					var safeKeyword = escapeRegExp(keyword);
					var regex = new RegExp('(' + safeKeyword + ')', 'gi');

					return text.replace(regex, '<span class="found">$1</span>');
				}

				$(document).on('input', '.league-search', function () {
					var keyword = $.trim($(this).val()).toLowerCase();

					$(targetSelector).each(function () {
						var $el = $(this);
						var original = $el.data('original');

						// reset
						$el.html(original);

						if (!keyword) return;

						if (original.toLowerCase().indexOf(keyword) > -1) {
							$el.html(highlight(original, keyword));
						}
					});
				});
			});
		</script>
	</body>
</html>
