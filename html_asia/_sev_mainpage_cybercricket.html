				<img class="fl_s_title_img" src="../assets/public/layout/images/icon/icon_s59.png" />

				<div class="event_selection_expand">
					<i class="icon-fi-arrow-down1" aria-hidden="true"></i>
				</div>
			</div>
			<div class="n_balance bal_promo">
				(RMB)<br />
				999,888,777.66
				<div class="promo_arrow moving_down">
					<div class="double_angle_down right_pd"></div>

<div class="n_content_wrap_wth_bcktop" id="sev_content">
	<div class="sev_content">
		<!--load from "_sev_dashboard_innerpage_shared.html"-->
		<div class="sev_inner_content" id="sev_all">
			<div class="n_sev_item_content_wrap">
				<!--load from "../html_asia/_sev_content_template.html"-->
			</div>
		</div>
	</div>
</div>

<script>
	var d1 = $.get('../html_asia/_sev_scoreboard_cybercricket_live.html');
	var d2 = $.get('../html_asia/_sev_dashboard_innerpage_cyberbattle.html');
	var d3 = $.get('../html_asia/_sev_cybercricket_content_template.html');
	var d4 = $.get('../html_asia/_global_norecord.html');
	var d5 = $.get('../html_asia/_sev_scoreboard_cybercricket_prematch.html');

	$.when(d1, d2, d3, d4, d5).done(function (data1, data2, data3, data4, data5) {
		$('#demo_sample_dashboard_scenarios')
			.empty()
			.append(localStorage.getItem('isCbPm') === 'true' ? data5[0] : data1[0]);
		$('.sev_content').prepend(data2[0]);
		$('#sev_all .n_sev_item_content_wrap').append(data3[0]);
		$('#sev_all .n_sev_item_content_wrap').append(data4[0]);
		$('#sev_all').siblings('.sev_inner_content').hide();
		if (localStorage.getItem('isCyberBattle') === 'true') {
			$('.general_wrap .wrap svg').hide();
			$('.general_wrap .wrap img').show();
		}

		detectSportsType();
		cbSEVCarousel();
		SEV_Group('', true);
		$('.n_visualization_wrap').removeClass('soccer').addClass('cs1');
		$('.s_title_wrp').find('.icon').removeClass('icon-fi-title-s1').addClass('icon-fi-title-cs1');
		$('.s_title').text('VS - IM 独家FIFA20意大利');

		if (localStorage.getItem('webcyberbattle') === 'true') {
			cbWebScroll('.n_sports_menu.slider_wrap_flexi');
		}

		infoPop('.n_sev_item_content_wrap');
	});
</script>
