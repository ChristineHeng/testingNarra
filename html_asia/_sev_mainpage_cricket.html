<div class="n_sev_view n_sticky">
	<div class="n_visualization_wrap cricket">
		<div class="n_header_sev">
			<div class="n_back">
				<a class="n_back_link" id="close_sev_popup"><i class="icon-fi-arrow-left"></i> Back</a>
			</div>
			<div class="s_title_wrp">
				<img class="fl_s_title_img" src="../assets/public/layout/images/icon/icon_s13.png" />
				<div class="s_title">VS - IM Cricket 19 Cyberbattle</div>
				<div class="event_selection_expand">
					<i class="icon-fi-arrow-down1" aria-hidden="true"></i>
				</div>
			</div>
			<div class="n_balance">
				(RMB)<br />
				999,888,777.66
			</div>
		</div>
		<div id="s_sev_top" class="s_sev_top">
			<div class="n_sev_top" id="demo_sample_dashboard_scenarios">
				<!--refer to 
                    1. _sev_scoreboard_cricket_live.html-->
			</div>
		</div>
	</div>
</div>
<div class="n_content_wrap_wth_bcktop" id="sev_content">
	<div class="sev_content">
		<!--load from "_sev_dashboard_innerpage_shared.html"-->

		<div class="sev_inner_content" id="sev_all">
			<div class="n_sev_item_content_wrap">
				<!--load from "_sev_content_xxxx.html"-->
			</div>
		</div>
	</div>
</div>

<script>
	/*refer to 
       1. _sev_scoreboard_cricket_live.html*/
	var d1 = $.get('../html_asia/_sev_scoreboard_cricket_live.html');
	var d2 = $.get('../html_asia/_sev_dashboard_innerpage_shared.html');
	var d3 = $.get('../html_asia/_sev_content_template.html');

	$.when(d1, d2, d3).done(function (data1, data2, data3) {
		$('#demo_sample_dashboard_scenarios').empty().append(data1[0]);
		$('.sev_content').prepend(data2[0]);
		$('#sev_all .n_sev_item_content_wrap').append(data3[0]);
		$('#sev_all').siblings('.sev_inner_content').hide();
		SEV_Group('', true);
		$('#MockOnly_sb_compact_cricket').show();
		$('#MockOnly_sb_compact_cricket').siblings('.sb_compact').hide();

		$('.invisibleFrameSEV').click(function () {
			var back = ['#ff0000', 'blue', 'gray'];
			var rand = back[Math.floor(Math.random() * back.length)];
			$('.invisibleFrameSEV').css('background', rand);
			$('.invisibleFrameSEV').css('opacity', 0.5);
		});
		$('#visualizationIframe').on('load', function () {
			$(this)
				.contents()
				.on('mousedown, mouseup, click', function () {
					//alert("Click detected inside iframe.");
					//test code from below. dev please ignore
					$('#MockOnly_sb_compact_cricket').css('z-index', 10);
					console.log('click iframe');
					setTimeout(function () {
						$('#MockOnly_sb_compact_cricket').css('z-index', '');
					}, 3000);
				});
		});

		if (sevCricket == 'default') {
			hideCricket();
			$('.demo_sev_cricket_live').show();
		}
		if (sevCricket == 'more') {
			hideCricket();
			$('.demo_sev_cricket_liveMore').show();
		}
		if (sevCricket == 'scroll') {
			hideCricket();
			$('.demo_sev_cricket_liveScroll').show();
			$('#sample_tw, #sample_tw_pin').addClass('rpo');
		}
	});
	//Cyber Battle View: start
	if (window.location.href.indexOf('cyber') > -1) {
		$('.n_visualization_wrap').removeClass('cricket').addClass('cs13');
		$('.s_title_wrp').find('.icon').removeClass('icon-fi-title-s13').addClass('icon-fi-title-cs13');
		$('.s_title').text('VS - IM 独家FIFA20意大利');

		detectSportsType();
	}
	//Cyber Battle View: end
</script>
