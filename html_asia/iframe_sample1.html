<!doctype html>
<html style="--status-bar-height: 0px; --window-left: 0px; --window-right: 0px; font-size: 18.75px; --window-top: calc(44px + env(safe-area-inset-top)); --window-bottom: 0px;">
<head>
    <meta charset="utf-8">
    <title>Narra - Sample 1</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover,user-scalable=no" />
    <script src="../assets/public/lib/jquery.js"></script>
    <style>
        body{
            padding: 0;
            margin: 0;
        }
        body,
        html {
            -webkit-user-select:none;
            user-select:none;
            width:100%;
            height:100%
        }
        body {
            overflow-x:hidden
        }
        body::after {
            position:fixed;
            content:'';
            left:-1000px;
            top:-1000px;
            -webkit-animation:shadow-preload .1s;
            -webkit-animation-delay:3s;
            animation:shadow-preload .1s;
            animation-delay:3s
        }
        #thisiframe{
            position: absolute;
            display: block;
            border: 0px none;
            top: 44px;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body id="root" class="">
    <div style="height: 44px; background: red; width: 100%;"> test header 1</div>
    <iframe id="thisiframe" src="index.html" ></iframe>
    <script>
         $(document).ready(function () {
            $("#thisiframe").css("height", ($(window).outerHeight() - 44));
        });
    </script>
</body>
</html>
