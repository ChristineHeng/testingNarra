<div class="n_header n_header_sports">
	<div class="n_back">
		<a class="n_back_link" target="_self"><i class="icon-fi-arrow-left"></i> Back</a>
	</div>
	<div class="title"><i class="icon-fi-insight"></i> Insights</div>
</div>
<div class="ss_header sticky lb_header">
	<i class="icon-fi-largebet"></i>
	<span>Large Bets Signal</span>
</div>
<div class="lb_menu_cover sticky">
	<div class="lb_menu_itm active" id="mock_cover_largebet">Large Bet</div>
	<div class="lb_menu_itm" id="mock_cover_prematch">Pre-Match Tips</div>
	<div class="lb_menu_itm" id="mock_cover_live">Live Tips</div>
</div>
<div class="n_container lb_container">
	<div id="demoOnly_insights_content_lb_popup"></div>
</div>
<!--for large bet insights page only-->
<div class="eventListingRefresh btn_float_ref btn_backtop show" id="lbRefresh"><i class="icon-fi-refresh-euro"></i></div>

<script>
	$(document).ready(function () {
		function setLbHeaderView(showHeader) {
			var $popup = $('#largebetinsights');

			$popup.find('.lb_header').toggle(showHeader);
			$popup.find('.lb_menu_cover').toggle(!showHeader);
			updateLbStickyOffsets();
		}

		setLbHeaderView(true);
		$(window)
			.off('resize.lbHeaderView')
			.on('resize.lbHeaderView', updateLbStickyOffsets);

		$('.n_back_link').click(function () {
			$('.n_footer.padding_fix').show();
			$('.n_footer_combo.clone').removeClass('no_bm');
			$('#largebetinsights').hide();
			popupOff();
		});
		$('#demoOnly_insights_content_lb_popup').load('../html_public/_largebet_record.html', function () {
			updateLbStickyOffsets();
			$('.lb_c_tl > img').attr('src', '../assets/public/layout/images/large_bet_profile.svg');
			$('.mock_no_largebet').click(function () {
				const darkTheme = ['betway', 'dark1', 'dark2', 'default'];
				const brightTheme = ['red', 'brown', 'green', 'blue', 'wellbet', 'xinli', 'bafa'];
				theme_value = localStorage.getItem('theme');
				if (darkTheme.includes(theme_value)) {
					document.getElementById('lb_xwrp_img').setAttribute('src', '../assets/public/layout/images/large_bet_dark.svg');
				}
				if (brightTheme.includes(theme_value)) {
					document.getElementById('lb_xwrp_img').setAttribute('src', '../assets/public/layout/images/large_bet_bright.svg');
				}
				$('.lb_xwrp').show();
				$('.lb_c').hide();
			});
			$('.fl_comp_lb .fl_comp_t').click(function () {
				$('.fl_comp_lb .fl_comp_t').removeClass('active');
				$(this).addClass('active');
			});
			$('#lb_header_toggle').on('click', function () {
				setLbHeaderView(!$('#largebetinsights .lb_header').is(':visible'));
			});

			lbMenu();
			tipsT();

			$('#mock_add_lb').on('click', function () {
				addLbCard();
			});

			$('.mock_lb_tut').on('click', function () {
				var $card = $($(this).data('tut-card'));
				var $mask = $($(this).data('tut-mask'));

				$('.lb_wrp, .n_header').add($card).addClass('lb_mask');
				$mask.show();
				$('#main_footer').hide();

				if ($(this).data('tut-expand')) {
					$card.find('.tips_t_r .icon-fi-full-up').removeClass('fl_rotate');
					$card.find('.tips_b').slideDown(200);
					setTipsToggleText($card.find('.tips_t_r'), 'Read Less ');
				}
			});

			$('.mock_lb_btn').on('click', function () {
				var $card = $($(this).data('tut-card'));
				var $mask = $($(this).data('tut-mask'));

				$('.lb_wrp, .n_header').add($card).removeClass('lb_mask');
				$mask.hide();
				$('#main_footer').show();
			});

			$(document).on('click', '.lb_c_tl img', function (e) {
				e.preventDefault();
				var $card = $(this).closest('.lb_c');
				removeLbCard($card);
			});

			$('.ss_tml_btn').on('click', function () {
				if ($(this).hasClass('ss_ex') || $(this).hasClass('mock_lb_tut')) {
					return;
				}

				$(this).addClass('add');
			});
		});

		function addLbCard() {
			var newCard = $(`
						<div class="lb_c lb_c_ptm">
							<div class="lb_c_t">
								<div class="lb_c_tl">
									<img src="../assets/public/layout/images/large_bet_profile.svg">
									<div class="lb_c_tlp">***lop, ***909, ***pop</div>
								</div>
								<div class="lb_c_time">Just Now</div>
							</div>
							<div class="lb_cs">
								<div class="lb_csl">
									<div class="lb_cscn">France Pro A League</div>
									<div class="lb_csld">Real Madrid vs Inter Milan</div>
									<div class="lb_cm">1x2<span class="odds_type">(Euro)</span></div>
									<div class="lb_cslt">
										New Bet <span class="fl_at">@</span>2.68
									</div>
								</div>
								<div class="ss_tml_btn">
									<div class="fl_tub_add">
										<i class="icon-fi-remove-mid"></i>
									</div>
									Follow Bet
								</div>
							</div>
							<div class="lb_b">
								<div class="lb_bl">
									<i class="icon-fi-coins"></i>
									<div class="lb_blt">
										Total: <span class="lb_blt_cur">RMB </span>
										<span class="lb_blt_stake">76,380</span><img src="../assets/public/layout/images/lb_fire.svg" />
									</div>
								</div>
								<div class="lb_p">
									<i class="icon-fi-people"></i>
									<span class="lb_pc">3</span> players followed
								</div>
							</div>
						</div>
			    	`);

			newCard.css({
				opacity: 0,
				height: 0,
				overflow: 'hidden',
				position: 'relative',
				// left: '-100%',
			});

			$('#mock_insights_largebets').prepend(newCard);
			var height = newCard.prop('scrollHeight');
			newCard.animate(
				{
					height: height,
					opacity: 1,
				},
				400,
				function () {
					newCard.css({
						height: '',
						overflow: '',
					});
				},
			);
		}

		function removeLbCard($card) {
			var height = $card.outerHeight();

			$card.css({
				position: 'relative',
				height: height,
				overflow: 'hidden',
			});

			$card.animate(
				{
					opacity: 0,
					left: '-100%',
				},
				300,
				function () {
					$card.animate({ height: 0 }, 200, function () {
						$card.remove();
					});
				},
			);
		}
	});
</script>
