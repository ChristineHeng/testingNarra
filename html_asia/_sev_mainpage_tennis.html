<script>
    /*refer to 
              1. _sev_scoreboard_tennis_live.html
              2. _sev_scoreboard_tennis_live_noscore.html
              2. _sev_scoreboard_tennis_prematch.html*/

    var d1 = $.get("../html_asia/_sev_scoreboard_tennis_live.html");
    var d2 = $.get("../html_asia/_sev_dashboard_innerpage_shared.html");
    var d3 = $.get("../html_asia/_sev_content_template.html");

    $.when(d1, d2, d3).done(function (data1, data2, data3) {
        $("#demo_sample_dashboard_scenarios").empty().append(data1[0]);
        $(".sev_content").prepend(data2[0]);
        $("#sev_all .n_sev_item_content_wrap").append(data3[0]);
        $("#sev_all").siblings(".sev_inner_content").hide();
        SEV_Group("", true);
        $("#MockOnly_sb_compact_tennis").show();
        $("#MockOnly_sb_compact_tennis").siblings(".sb_compact").hide();
    });

    //Cyber Battle View: start
    if (window.location.href.indexOf("cyber") > -1) {
        $(".n_visualization_wrap").removeClass("tennis").addClass("cs3");
        $(".s_title_wrp").find(".icon").removeClass("icon-fi-title-s3").addClass("icon-fi-title-cs3");
        $(".s_title").text("VS - IM 独家FIFA20意大利");

        detectSportsType();
    }
    //Cyber Battle View: end
</script>
