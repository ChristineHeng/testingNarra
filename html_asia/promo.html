    <div class="footer_main" id="main_footer"></div>
    <div id="demoOnly_global_pop_item"></div>

    <script>
        $(document).ready(function () {
            promoFooter();
            $("#demoOnly_global_pop_item").load("_global_pop_item.html", function () {
                $("#mybet").load("_popup_mybet_unsettled.html");
            });
            promo();
            promotionSlider();


            if(localStorage.getItem("isFacelift") === "true") {
                $(".prcdTlAvlb").toggleClass("prcdTlAvlb prcdWrp")
                $(".prcdWrp").find(".prcdTlItm").toggleClass("prcdTlItm prcdItm")
            }

            function promotionSlider() {
                var sliderWidth = $(".prcdTlAvlb .prcdTlItm.active").width();
                var slider = $(".prcdTlAvlb .prcdSld");
                slider.css("width", sliderWidth);
                slider.css("left", $(".prcdTlAvlb .prcdTlItm.active").offset().left);

                if(localStorage.getItem("isFacelift") === "true") {
                    $(".prcdTlAvlb").hide();
                    $(".new_prcdTab").show();
                    $(".new_prcdTab .prcdWrp .prcdItm").click(function() {
                        $(".prcdItm").removeClass("active")
                        $(this).addClass("active");
                    })
                }

                $(".prcdTlAvlb .prcdTlItm").click(function () {
                    $(".prcdTlAvlb .prcdTlItm").removeClass("active");
                    $(this).addClass("active");
                    slider.css("left", $(".prcdTlAvlb .prcdTlItm.active").offset().left);
                    if ($(".prcdTlAvlb .prcdTlItm.active").attr('id') == "test_mock_daily_promotion") {
                        $("#test_mock_daily_promotion_wrap").show();
                        $("#test_mock_other_promotion_wrap").hide();
                    } else {
                        $("#test_mock_daily_promotion_wrap").hide();
                        $("#test_mock_other_promotion_wrap").show();
                    }
                });
            }
            cyberbattleBackButton();
        });
    </script>
