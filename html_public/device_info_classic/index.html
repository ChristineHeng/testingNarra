<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Narra - html template</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover,user-scalable=no" />
    <link rel="stylesheet" type="text/css" href="style.min.css">
</head>

<body id="root">
    <div class="n_header n_header_main">
        <div class="logo">
            <img src="../../merchants/merchant1/images/logo2.png">
        </div>
        <div class="n_balance">
            <!-- long currency code : GAMERSTAKE -->
            <div class="currency">(RMB)</div>
            7,676,100,962,132.55
        </div>
    </div>
    <div class="cls_sports_header">
        <div class="cls_back" onclick="history.back();">
            <i class="icon-fi-arrow-left-rounded-long" aria-hidden="true"></i>
        </div>
       <div class="cls_sportsinfo">
            <div>
                设备信息
            </div>
       </div>
    </div>       
    <div class="deviceInfo_wrap">
        <div class="deviceInfo_inner">
            <div class="deviceInfo_item">                    
                <div class="info_icon">
                    <i class="icon-fi-member-code"></i>
                </div>
                <div class="details">
                    <div class="item_title">
                        Member Code:
                    </div>
                    <div class="info">
                        325252
                    </div>
                </div>
            </div>
            <div class="deviceInfo_item">
                <div class="info_icon">
                    <i class="icon-fi-worldwide"></i>
                </div>
                <div class="details">
                    <div class="item_title">
                        Country:
                    </div>
                    <div class="info">
                        China
                    </div>
                </div>
            </div>
            <div class="deviceInfo_item">
                <div class="info_icon">
                    <i class="icon-fi-operating-system"></i>
                </div>
                <div class="details">
                    <div class="item_title">
                        Operating System:
                    </div>
                    <div class="info">
                        Android 10
                    </div>
                </div>
            </div>
            <div class="deviceInfo_item">
                <div class="info_icon">
                    <i class="icon-fi-browser"></i>
                </div>
                <div class="details">
                    <div class="item_title">
                        Browser:
                    </div>
                    <div class="info">
                        Google Chrome, Version 77.0.3865.103
                    </div>
                </div>
            </div>                                
            <div class="deviceInfo_item lastitem">
                <div class="left_lantency">
                    <div class="info_icon">
                        <i class="icon-fi-time-left"></i>
                    </div>
                    <div class="details">
                        <div class="item_title">
                            Latency:
                        </div>
                        <div class="info">
                            <span class="time">(300ms), (100ms)</span>
                        </div>
                    </div>
                </div>
                <a href="#" class="right_lantency">
                    <div class="loading_lantency" style="display:none"></div>
                    <span class="test">Retry</span>
                </a>
            </div>
            <div class="deviceInfo_item">
                <div class="info_icon">
                    <i class="icon-fi-id"></i>
                </div>
                <div class="details">
                    <div class="item_title">
                        Trace ID:
                    </div>
                    <div class="info">
                        <span class="time">8011276a-0033-2323-09911</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="deviceInfo_wrap screenshot_msg">
        对此页面进行截图且将载屏图片发送给客服人员，即可询问并解决此故障问题。
    </div>
</body>
</html>
