<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Narra - html template</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover,user-scalable=no" />
    <link rel="stylesheet" type="text/css" href="style.min.css">
</head>

<body id="root">

    <div class="n_header">
        <div class="n_back"><!-- <a href="javascript:history.back()" class="n_back_link" target="_self"><i class="icon-fi-arrow-left"></i> 返回</a> --></div>
        <div class="title"><i class="icon-fi-device-info"></i> 设备信息</div>
    </div>        
    <div class="deviceInfo_wrap">
        <div class="deviceInfo_inner">
            <div class="deviceInfo_item">                    
                <div class="info_icon">
                    <i class="icon-fi-member-code"></i>
                </div>
                <div class="details">
                    <div class="item_title">
                        Member Code:
                    </div>
                    <div class="info">
                        325252
                    </div>
                </div>
            </div>
            <div class="deviceInfo_item">
                <div class="info_icon">
                    <i class="icon-fi-worldwide"></i>
                </div>
                <div class="details">
                    <div class="item_title">
                        Country:
                    </div>
                    <div class="info">
                        China
                    </div>
                </div>
            </div>
            <div class="deviceInfo_item">
                <div class="info_icon">
                    <i class="icon-fi-operating-system"></i>
                </div>
                <div class="details">
                    <div class="item_title">
                        Operating System:
                    </div>
                    <div class="info">
                        Android 10
                    </div>
                </div>
            </div>
            <div class="deviceInfo_item">
                <div class="info_icon">
                    <i class="icon-fi-browser"></i>
                </div>
                <div class="details">
                    <div class="item_title">
                        Browser:
                    </div>
                    <div class="info">
                        Google Chrome, Version 77.0.3865.103
                    </div>
                </div>
            </div>                                
            <div class="deviceInfo_item lastitem">
                <div class="left_lantency">
                    <div class="info_icon">
                        <i class="icon-fi-time-left"></i>
                    </div>
                    <div class="details">
                        <div class="item_title">
                            Latency:
                        </div>
                        <div class="info">
                            <span class="time">(300ms), (100ms)</span>
                        </div>
                    </div>
                </div>
                <a href="#" class="right_lantency">
                    <div class="loading_lantency" style="display:none"></div>
                    <span class="test">Retry</span>
                </a>
            </div>
            <div class="deviceInfo_item">
                <div class="info_icon">
                    <i class="icon-fi-id"></i>
                </div>
                <div class="details">
                    <div class="item_title">
                        Trace ID:
                    </div>
                    <div class="info">
                        <span class="time">8011276a-0033-2323-09911</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="deviceInfo_wrap screenshot_msg">
        对此页面进行截图且将载屏图片发送给客服人员，即可询问并解决此故障问题。
    </div>
</body>
</html>
