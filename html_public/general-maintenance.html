<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Narra - html template</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover,user-scalable=no" />
    

    <style>
        body {
            font-family: Helvetica,Arial,"Microsoft Yahei","微软雅黑",STXihei,"华文细黑",sans-serif;
           
        }
        .general_wrap {
             display:table;
             height:100%;
             left:0;
             margin:0;
             padding:0;
             position:absolute;
             top:0;
             width:100%
             background:#e4e4e4;
             *background:#e4e4e4;
             background:-moz-linear-gradient(top,#fff 0%,#c7c7c7 100%);
             background:-webkit-gradient(linear,left top,left bottom,color-stop(0%,#fff),color-stop(100%,#c7c7c7));
             background:-webkit-linear-gradient(top,#fff 0%,#c7c7c7 100%);
             background:-o-linear-gradient(top,#fff 0%,#c7c7c7 100%);
             background:-ms-linear-gradient(top,#fff 0%,#c7c7c7 100%);
             background:linear-gradient(to bottom,#fff 0%,#c7c7c7 100%);
             filter:progid:DXImageTransform.Microsoft.gradient(startColorstr='#ffffff',endColorstr='#c7c7c7',GradientType=0);
             width: 100%;
        }
        .general_wrap_content{
             display:table-cell;
             margin:0;
             padding:0;
             vertical-align:middle
        }
        .general_wrap_content_inner{
            margin:0 auto;
            text-align:center;
            width:86%
        }
        .general_wrap_content_inner_header {
             width:100%;
             display:-webkit-box;
             display:-moz-box;
             display:-ms-flexbox;
             display:-webkit-flex;
             display:flex;
             -webkit-box-align:center;
             -moz-box-align:center;
             -ms-flex-align:center;
             -webkit-align-items:center;
             align-items:center;
             -webkit-box-pack:center;
             -moz-box-pack:center;
             -ms-flex-pack:center;
             justify-content:center;
             -webkit-justify-content:center;
        }
        .header_img img{
            width:110px
        }
        .header_title_en {
             font-size:20px;
             text-transform: uppercase;
             font-family: Arial, Helvetica, sans-serif;
             font-weight: bold;
        }
        .header_title_en2 {
            font-size:30px;
        }
        .header_title_cn {
             font-family: "Microsoft Yahei","微软雅黑",STXihei,"华文细黑",sans-serif;
             color: #ca4c00;
              font-size:30px;
        }
         .general_wrap_content_inner_content {
              font-size: 16px;
         }
        .highlighted {
            font-weight: bold;
            color: #014e7b;
          
        }
        .img_wrap {
            padding: 10px;
           
        }
        .img_wrap img{
            width: 30%;
            max-width: 210px;
        }
    </style>
</head>

<body id="root" >
    <div class="general_wrap">
        <div class="general_wrap_content">
            <div class="general_wrap_content_inner">
                <div class="general_wrap_content_inner_header">
                    <div class="header_title_en">
                        system under <br />
                        <span class="header_title_en2">maintenance</span> 
                        <br />
                        <span class="header_title_cn">维护进行中</span>
                    </div>
                </div>
                <br />
                   <div class="img_wrap">
                       <img src="../assets/public/layout/images/icon_maintenance.png" />
                   </div>
                <br />
                <div class="general_wrap_content_inner_content">
                    <div class="content_en">
                        Our scheduled maintenance on <span class="highlighted">24-August-2017 between 00.00 to 12.00 (GMT+8).</span>
                        Please visit us again later. Thank you.
                    </div>
                    <br />
                    <div class="content_cn">
                        我们的系统将在 <span class="highlighted">2017年8月24日 00.00 to 12.00 (GMT+8)</span> 进行维护. 请稍后再尝试， 谢谢.
</div>
                </div>

            </div>

        </div>
    </div>
</body>
</html>
